<style>
:root {
  --bg: #060c17;
  --bg-2: #0a1424;

  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100svh;
  display: grid; place-items: center;
  padding: 48px 16px;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(210, 177, 122, 0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(79, 195, 161, 0.06), transparent 60%),
    var(--bg);
  color: var(--text);
  font: 15px/1.8 var(--sans);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  opacity: 0.5;
}
::selection { background: var(--gold); color: var(--bg); }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

.card {
  position: relative; width: 100%; max-width: 640px;
  padding: 56px 56px 44px;
  background: linear-gradient(180deg, rgba(15, 29, 51, 0.82), rgba(10, 20, 36, 0.92));
  border: 1px solid var(--line);
  box-shadow: 0 40px 120px -40px rgba(0, 0, 0, 0.8);
  animation: rise 0.9s cubic-bezier(.22, 1, .36, 1) both;
}
/* 四角金色描边 */
.card::before, .card::after {
  content: ""; position: absolute; width: 22px; height: 22px; border: 1px solid var(--gold);
}
.card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.card::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.top { display: flex; align-items: center; gap: 22px; }
.mark {
  flex: none; width: 64px; height: 64px; display: grid; place-items: center;
  border: 1px solid var(--gold-dim); outline: 1px solid var(--gold-dim); outline-offset: 4px;
  font: 600 30px/1 var(--serif); color: var(--gold);
}
h1 { margin: 0; font: 600 34px/1.2 var(--serif); letter-spacing: 0.18em; }
.en { margin-top: 6px; font: 12px/1 var(--mono); letter-spacing: 0.32em; color: var(--muted); }

.role { margin: 34px 0 0; font: 500 17px/1.6 var(--serif); color: var(--gold); letter-spacing: 0.08em; }
.rule { height: 1px; margin: 18px 0 20px; background: linear-gradient(90deg, var(--gold-dim), transparent); }
.lead { margin: 0; color: var(--muted); }
.lead b { color: var(--text); font-weight: 500; }

.links { list-style: none; margin: 36px 0 0; padding: 0; border-top: 1px solid var(--line); }
.links a {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 4px 14px;
  padding: 20px 4px; border-bottom: 1px solid var(--line);
  transition: background 0.3s, padding 0.3s;
}
.links a:hover { background: rgba(210, 177, 122, 0.05); padding-left: 12px; }
.no { font: 12px/1 var(--mono); color: var(--gold); letter-spacing: 0.1em; }
.name { font: 600 17px/1.5 var(--serif); }
.url { grid-column: 2; font: 12.5px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
.arrow { grid-row: 1 / span 2; grid-column: 3; color: var(--gold); transition: transform 0.3s; }
.links a:hover .arrow { transform: translateX(4px); }
.live {
  display: inline-flex; align-items: center; gap: 7px; margin-left: 10px;
  font: 11.5px/1 var(--mono); color: var(--ok); letter-spacing: 0.04em; vertical-align: 2px;
}
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(79, 195, 161, 0.6); animation: pulse 2.4s infinite; }
.live.stale { color: var(--muted); }
.live.stale i { background: var(--muted); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(79, 195, 161, 0); } 100% { box-shadow: 0 0 0 0 rgba(79, 195, 161, 0); } }

.reel {
  display: inline-flex; align-items: center; gap: 12px; margin-top: 26px;
  font: 500 14px/1 var(--sans); color: var(--gold); letter-spacing: 0.06em;
}
.reel .play {
  width: 34px; height: 34px; display: grid; place-items: center; padding-left: 2px;
  border: 1px solid var(--gold-dim); border-radius: 50%; transition: background 0.3s, color 0.3s;
}
.reel:hover .play { background: var(--gold); color: var(--bg); }
.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  margin-top: 30px; font-size: 13px; color: var(--muted);
}
.foot a { color: var(--text); border-bottom: 1px solid var(--gold-dim); }
.foot a:hover { border-color: var(--gold); }

@media (max-width: 560px) {

  .en { letter-spacing: 0.22em; }
  .live { display: flex; margin: 6px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .live i { animation: none; }
  .links a, .arrow { transition: none; }
}

<script>
// 平台状态：ops.liuxd.dev 每 10 分钟生成 /status.json（只对 liuxd.dev 开放跨域）。取不到就不显示，不影响页面。
(async () => {
  const el = document.querySelector('[data-live]');
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch('https://ops.liuxd.dev/status.json', { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    const age = Date.now() - new Date(s.generatedAt).getTime();
    if (!(age >= 0) || age > 60 * 60 * 1000) {
      el.classList.add('stale');
      el.querySelector('[data-live-text]').textContent = '状态数据未更新';
    } else {
      const a = typeof s.availability7d === 'number' ? ` · 7 天可用率 ${s.availability7d}%` : '';
      el.querySelector('[data-live-text]').textContent = `运行中${a}`;
    }
    el.hidden = false;
  } catch {}
})();
</script>
